# Local development and integration testing only.
# Production remains: React/S3/CloudFront -> API Gateway -> Lambda -> MongoDB Atlas.

services:
  mongo:
    image: mongo:7
    volumes:
      - noticeboard_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: noticeboard_db
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  noticeboard_mongo_data:
